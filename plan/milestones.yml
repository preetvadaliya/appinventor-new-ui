# One milestone per phase. Due dates assume half-time work (2.5 days a week) from
# Monday 2026-10-19 with a 20% buffer; tools/sync.py recomputes ticket dates from
# the estimates in plan/tickets/*.md.
start: 2026-10-19
days_per_week: 2.5
buffer: 1.2

milestones:
  - key: P0
    title: "P0 · Groundwork"
    due: 2026-10-28
    description: >-
      Dead code is gone and every later PR can prove it changes nothing on screen.
  - key: P1
    title: "P1 · Layouts by id"
    due: 2026-11-09
    description: >-
      Classic and neo are chosen by a LayoutId and implement one Layout contract,
      instead of a boolean and a factory that neo subclasses.
  - key: P2
    title: "P2 · Live light/dark"
    due: 2026-12-16
    description: >-
      Switching light/dark no longer reloads the page, in classic and neo.
  - key: P3
    title: "P3 · Actions"
    due: 2027-02-04
    description: >-
      Every toolbar and menu item runs on an ActionId; no logic finds widgets by name.
  - key: P4
    title: "P4 · Independent views"
    due: 2027-04-11
    description: >-
      Classic and neo each own their views under layouts/; nothing inherits from classic.
  - key: P5
    title: "P5 · Controls"
    due: 2027-08-15
    description: >-
      Each layout has its own controls and its own designer and blocks regions;
      property editors are models with choice lists as data; actions live in core.
  - key: P6
    title: "P6 · CSS split"
    due: 2027-09-21
    description: >-
      No global stylesheet: each layout loads only its own tokens, controls and view CSS.
  - key: P7
    title: "P7 · Final moves"
    due: 2027-10-01
    description: >-
      Packages sit in core/, controls/, features/ and layouts/, and a test enforces the
      import rules. Nova can start.
  - key: Nova
    title: "Nova"
    due: null
    description: >-
      A third layout, added as one folder under layouts/. Planned after P7.
